<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Four quick daily sports puzzles for NBA, NFL, NHL and MLB fans: Journeyman, Links, Stat Line and Higher or Lower.">
<meta property="og:title" content="Shootaround: daily sports puzzles">
<meta property="og:description" content="Journeyman, Links, Stat Line and Higher or Lower. New NBA, NFL, NHL and MLB puzzles every day.">

<link rel="apple-touch-icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column. Home is a stack of three game "tickets"; each game has one hero visual
   (route, tile grid, box-score line). Purple court-at-night palette; semantic green/amber stay separate. */
:root {
  --bg: #f4f1f9;
  --surface: #ffffff;
  --ink: #1c1330;
  --muted: #6b6280;
  --line: #ddd6ea;
  --accent: #6d3fd6;
  --g-jm: #7b3fe4;
  --g-k4: #a8338f;
  --g-sl: #4a45c4;
  --g-hl: #9a2fd0;
  --good: #23905a;
  --near: #c98f10;
  --miss: #c4bcd3;
  --t0: #f2c84b; --t1: #8ccb6e; --t2: #84aef2; --t3: #c08ae0;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #120c1f; --surface: #1d1530; --ink: #efeaf8; --muted: #a297b8; --line: #33284b;
    --accent: #a57cff; --g-jm: #a57cff; --g-k4: #e070c9; --g-sl: #8f8aff; --g-hl: #d49cff;
    --good: #3bb877; --near: #e0ad35; --miss: #3d3156;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #120c1f; --surface: #1d1530; --ink: #efeaf8; --muted: #a297b8; --line: #33284b;
  --accent: #a57cff; --g-jm: #a57cff; --g-k4: #e070c9; --g-sl: #8f8aff; --g-hl: #d49cff;
  --good: #3bb877; --near: #e0ad35; --miss: #3d3156;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
a { color: inherit; }
.wrap { max-width: 580px; margin: 0 auto; padding: 18px 16px 48px; display: flex; flex-direction: column; gap: 18px; }

header { display: flex; flex-direction: column; gap: 12px; }
.brand { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: clamp(42px, 11vw, 60px); line-height: .85; text-transform: uppercase; margin: 0; text-decoration: none; }
.wordmark { display: inline-flex; align-items: center; gap: .22em; }
.wordmark b { font-weight: inherit; }
.wordmark b span { color: var(--accent); }
.wordmark .logo { width: .9em; height: .9em; flex: none; border-radius: .22em; }
.meta { font-size: 14px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.meta strong { color: var(--ink); font-weight: 600; }
.ico { width: 18px; height: 18px; flex: none; display: inline-block; vertical-align: -3px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topbar .wordmark { min-width: 0; white-space: nowrap; }
.tools { flex: none; }
.tools { display: flex; gap: 6px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.iconbtn:hover { border-color: var(--accent); color: var(--accent); }
nav { display: flex; gap: 6px; }
nav a { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; font: 600 13px/1 var(--body); letter-spacing: .04em; text-transform: uppercase; text-decoration: none; padding: 10px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
nav a[aria-current="page"] { background: var(--accent); color: #fff; border-color: var(--accent); }
nav a { position: relative; }
nav a .done-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
@media (max-width: 560px) {
  body { padding-bottom: calc(74px + env(safe-area-inset-bottom, 0px)); }
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; gap: 0; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(20,8,40,.08); }
  nav a { flex-direction: column; gap: 4px; border: 0; background: transparent; font-size: 10px; padding: 7px 2px; border-radius: 10px; }
  nav a .ico { width: 22px; height: 22px; }
  nav a[aria-current="page"] { background: transparent; color: var(--accent); }
}

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; position: relative; }
.prompt { margin: 0 0 14px; font-size: 15px; color: var(--muted); }
.prompt b { color: var(--ink); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.game-title { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; margin: 0; }
.badges { display: flex; gap: 6px; }
.badge { font: 700 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; border-radius: 4px; padding: 4px 7px; border: 1px solid var(--line); color: var(--muted); }
.badge.l0 { color: var(--good); border-color: var(--good); }
.badge.l1 { color: var(--near); border-color: var(--near); }
.badge.l2 { color: var(--accent); border-color: var(--accent); }
.badge.pr { background: var(--accent); color: #fff; border-color: var(--accent); }
button { font-family: var(--body); }
button.primary, button.ghost { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
button.primary { font: 700 15px/1 var(--body); letter-spacing: .04em; text-transform: uppercase; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; }
button.primary:disabled { opacity: .4; cursor: not-allowed; }
button.ghost { font: 600 14px/1 var(--body); background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; cursor: pointer; }
button.ghost:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, a:focus-visible, .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.msg { min-height: 20px; font-size: 14px; color: var(--accent); margin: 6px 2px 0; }
.foot-note { font-size: 13px; color: var(--muted); margin: 0; }
[hidden] { display: none !important; }
/* ---- Higher or Lower */
.short { display: none; }
@media (max-width: 560px) { nav .full { display: none; } nav .short { display: inline; } }
.hl-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
.hl-pips { display: flex; gap: 6px; }
.hl-pip { width: 26px; height: 8px; border-radius: 4px; background: var(--line); }
.hl-pip.now { background: var(--g-hl); }
.hl-pip.ok { background: var(--good); }
.hl-pip.bad { background: var(--accent); opacity: .55; }
.hl-level { font-size: 13px; color: var(--muted); font-weight: 600; }
.hl-stat { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.05; text-transform: uppercase; margin: 0 0 14px; text-wrap: balance; }
.hl-versus { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 10px; }
.hl-player { border: 2px solid var(--line); border-radius: 14px; padding: 16px 14px; background: var(--bg); display: flex; flex-direction: column; gap: 4px; text-align: center; animation: rise .35s ease-out both; }
.hl-player.ok { border-color: var(--good); }
.hl-player.bad { border-color: var(--accent); }
.hl-name { font-weight: 700; font-size: 17px; line-height: 1.2; }
.hl-ctx { font-size: 13px; color: var(--muted); }
.hl-val { font-family: var(--display); font-weight: 800; font-size: 54px; line-height: 1; margin: auto 0; padding: 10px 0; font-variant-numeric: tabular-nums; }
.hl-vs { align-self: center; font: 800 18px/1 var(--display); text-transform: uppercase; color: var(--muted); }
.hl-ask { margin: 16px 0 10px; font-size: 16px; text-align: center; }
.hl-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hl-buttons button { padding: 16px; font-size: 17px; }
.hl-buttons button[data-pick="lower"] { background: var(--ink); color: var(--bg); }
.hl-verdict { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 16px 0 12px; font-size: 16px; text-align: center; }
.hl-verdict.ok .ico { color: var(--good); }
.hl-verdict.bad .ico { color: var(--accent); }
@media (max-width: 420px) { .hl-val { font-size: 40px; } .hl-name { font-size: 15px; } .hl-stat { font-size: 24px; } .hl-player { padding: 12px 8px; } }
@media (min-width: 960px) { .hl-val { font-size: 72px; } .hl-stat { font-size: 36px; } .hl-player { padding: 22px 18px; min-height: 230px; } }
/* ---- hint panels */
.panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.panel-head b { font: 800 18px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.panel-head .muted { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.panel-head .ico { color: var(--accent); }
.panel-note { margin: 0; font-size: 14px; color: var(--muted); }
.named { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.named div { display: flex; align-items: center; gap: 10px; border-radius: 10px; padding: 10px 12px; background: var(--tc); color: #170f24; font-weight: 700; }
.kinds { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 6px; }
.kinds li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--bg); font-size: 14px; }
.kinds .count .ico { width: 14px; height: 14px; }
.kinds .count { flex: none; min-width: 26px; height: 26px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--line); font: 700 12px/1 var(--body); color: var(--accent); }
.side .hints { margin-top: 0; }
/* ---- layout: one column on phones, two columns on wide screens */
.layout { display: flex; flex-direction: column; gap: 16px; }
.side { display: flex; flex-direction: column; gap: 14px; }
.textlink { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); text-decoration: none; background: none; border: 0; padding: 6px 2px; cursor: pointer; font-family: var(--body); }
.textlink:hover { color: var(--accent); }
.textlink .ico { width: 16px; height: 16px; }
.archive-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 55vh; overflow-y: auto; }
.archive-list button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 14px/1.2 var(--body); cursor: pointer; text-align: left; }
.archive-list button:hover { border-color: var(--accent); }
.archive-list .st { font-size: 12px; color: var(--muted); font-weight: 600; }
.archive-list .st.won { color: var(--good); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.toggle span { font-size: 14px; color: var(--muted); display: block; }
.toggle b { display: block; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 14px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(18px); }
.switch input:focus-visible + i { outline: 3px solid var(--accent); outline-offset: 2px; }
.legal { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
/* ---- colour-blind palette (Okabe-Ito) + shapes on groups */
:root.cb { --t0: #F0E442; --t1: #56B4E9; --t2: #E69F00; --t3: #CC79A7; --good: #0072B2; --near: #E69F00; }
.shape { display: none; font-size: 15px; line-height: 1; }
:root.cb .shape { display: inline; }

.view { display: flex; flex-direction: column; gap: 16px; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }

/* Home */
.hero-line { font-size: 18px; margin: 0; max-width: 34ch; text-wrap: balance; }
.sports { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.sport { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; font: 800 15px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 8px 14px; border-radius: 9px; border: 0; color: var(--muted); text-decoration: none; }
.sport.on { background: var(--accent); color: #fff; }
.sport:not(.on):hover { color: var(--ink); }
.sport small { text-transform: none; font-weight: 500; margin-left: 3px; letter-spacing: 0; }
.tickets { display: grid; grid-template-columns: 1fr; gap: 12px; }
.ticket { position: relative; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 16px 24px; text-decoration: none; color: inherit; overflow: hidden; transition: border-color .15s, transform .15s; }
.ticket:hover { border-color: var(--gc); transform: translateY(-2px); }
.ticket .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--gc); }
.t-top, .t-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.t-foot { margin-top: auto; padding-top: 4px; }
.ticket .gi { display: inline-flex; width: 30px; height: 30px; color: var(--gc); }
.ticket .gi .ico { width: 100%; height: 100%; }
.t-cta { display: inline-flex; align-items: center; gap: 6px; font: 700 13px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--gc); }
.t-cta .ico { width: 16px; height: 16px; }
.streak.none { color: var(--muted); font-weight: 500; }
.ticket .streak { display: inline-flex; align-items: center; gap: 4px; font: 700 13px/1 var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
.ticket .streak .ico { width: 15px; height: 15px; color: #e8772e; }
.ticket h2 { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; margin: 0; text-transform: uppercase; }
.ticket p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 4px; font: 700 11px/1 var(--body); letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.status .ico { width: 13px; height: 13px; }
.status.won { background: var(--good); border-color: var(--good); color: #fff; }
.status.lost { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.status.live { border-color: var(--gc); color: var(--gc); }
.ticket:hover h2 { color: var(--gc); }

/* Journeyman route */
.route { list-style: none; margin: 0; padding: 0; position: relative; }
.route::before { content: ""; position: absolute; left: 11px; top: 16px; bottom: 16px; width: 4px; background: var(--ink); border-radius: 2px; opacity: .85; }
.stop { position: relative; display: grid; grid-template-columns: 22px 1fr; align-items: center; column-gap: 10px; padding: 6px 0 6px 40px; animation: rise .45s ease-out both; animation-delay: calc(var(--i) * 90ms); }
.dot { position: absolute; left: 3px; top: 50%; margin-top: -10px; width: 20px; height: 20px; border-radius: 50%; background: var(--c); border: 4px solid var(--surface); box-shadow: 0 0 0 2px var(--ink); }
.stop-num { font: 600 12px/1 var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
.stop-team { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; text-transform: uppercase; }
.stop-sub { grid-column: 2; font-size: 13px; color: var(--muted); }
.again { font: 700 10px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; margin-left: 8px; vertical-align: 5px; }
@keyframes rise { from { opacity: .15; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Hints */
.hints { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.hint { border: 1px dashed var(--line); border-radius: 10px; padding: 9px 11px; min-height: 58px; }
.hint.open { border-style: solid; background: var(--bg); animation: rise .3s ease-out both; }
.hint.wide { grid-column: 1 / -1; }
.hint-label { font: 700 11px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hint-value { font-weight: 600; margin-top: 3px; }
.hint:not(.open) .hint-value { color: var(--muted); font-weight: 500; font-size: 14px; }

/* Guess entry */
.entry { position: relative; display: flex; gap: 8px; }
.entry #skip { padding: 0 14px; }
@media (max-width: 420px) {
  .hide-sm { display: none; }
  .wordmark { font-size: min(34px, 9vw); }
  .iconbtn { width: 36px; height: 36px; }
  .tools { gap: 4px; }
  .sport { font-size: 13px; padding: 8px 6px; gap: 4px; }
}
.entry input { flex: 1; min-width: 0; font: 500 17px var(--body); color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 11px 12px; }
.entry input:focus { outline: none; border-color: var(--accent); }
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 24px rgba(20,8,40,.2); max-height: 260px; overflow-y: auto; }
.suggest li { padding: 9px 10px; border-radius: 7px; cursor: pointer; }
.suggest li[aria-selected="true"], .suggest li:hover { background: var(--bg); }

/* Guess log */
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.row { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; border-radius: 10px; padding: 9px 11px; border: 1px solid var(--line); min-height: 44px; background: var(--surface); }
.row.fresh { animation: pop .4s ease-out; }
.row .n { font: 600 12px var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
.row .who { font-weight: 600; }
.row .why { font-size: 13px; color: var(--muted); text-align: right; }
.row.empty { border-style: dashed; background: transparent; }
.row .who.left { font-weight: 500; color: var(--muted); }
.main { display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 959px) {
  /* one column: card, then guess box, then clues, then guesses */
  .layout > .main, .layout > .side { display: contents; }
  .layout > .main > section.card:not([aria-label]) { order: 1; }
  .layout section:has(> form.entry) { order: 2; }
  .layout [aria-label="Clues"], .layout [aria-label="Hints"] { order: 3; }
  .layout > .side > .log { order: 4; }
  .layout > .side > .row-actions { order: 5; }
  .layout > .side > .legal { order: 6; }
}
.row.miss { border-left: 6px solid var(--miss); }
.row.near { border-left: 6px solid var(--near); }
.row.hit { border-left: 6px solid var(--good); }
.row.skip { border-left: 6px dashed var(--line); color: var(--muted); }
.row.skip .who { font-weight: 500; font-style: italic; }
.row.stat { grid-template-columns: 26px 1fr; }
.minis { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
.mini { border-radius: 6px; padding: 5px 4px; text-align: center; background: var(--bg); font-variant-numeric: tabular-nums; }
.mini b { display: block; font-size: 15px; }
.mini span { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.mini.hit { background: var(--good); color: #fff; }
.mini.hit span { color: rgba(255,255,255,.85); }
.mini.near { background: var(--near); color: #1b1300; }
.mini.near span { color: rgba(27,19,0,.7); }
.row.fresh .mini { animation: flip .45s ease-out both; animation-delay: calc(var(--j) * 70ms); }
@keyframes flip { from { transform: rotateX(90deg); } to { transform: none; } }
@keyframes pop { 0% { transform: scale(.97); } 60% { transform: scale(1.02); } 100% { transform: none; } }

<script>
/* =====================================================================
   CONFIG. Each sport has its own data file built from Basketball-Reference.
   ===================================================================== */
const SPORTS = {
  nba: { label: "NBA", file: "nba.json", src: "Basketball-Reference", cap: "Per game, regular season, whole NBA career." },
  nfl: { label: "NFL", file: "nfl.json", src: "nflverse (Pro Football Reference draft data and NFL rosters)", cap: "Career totals, regular season, drafted players since 1980." },
  nhl: { label: "NHL", file: "nhl.json", src: "NHL.com", cap: "Career totals, regular season, NHL only." },
  mlb: { label: "MLB", file: "mlb.json", src: "the Lahman Baseball Database", cap: "Career totals, regular season." }
};
let SPORT = "nba";
/* ---- Settings for your GitHub copy: change these two lines to match your repo ---- */
const GITHUB_REPO = "Derek1267/Shootaround";                       // where "Report a problem" opens an issue

const TEAM_COLORS = {
  "Hawks":"#E03A3E","Celtics":"#007A33","Nets":"#000000","Hornets":"#00788C","Bobcats":"#F26532","Bulls":"#CE1141",
  "Cavaliers":"#860038","Mavericks":"#00538C","Nuggets":"#FEC524","Pistons":"#C8102E","Warriors":"#1D428A","Rockets":"#CE1141",
  "Pacers":"#FDBB30","Clippers":"#C8102E","Lakers":"#552583","Grizzlies":"#5D76A9","Heat":"#98002E","Bucks":"#00471B",
  "Timberwolves":"#236192","Pelicans":"#0C2340","Knicks":"#F58426","Thunder":"#007AC1","SuperSonics":"#00653A","Magic":"#0077C0",
  "76ers":"#006BB6","Suns":"#E56020","Trail Blazers":"#E03A3E","Kings":"#5A2D81","Spurs":"#8A8D8F","Raptors":"#CE1141",
  "Jazz":"#002B5C","Wizards":"#002B5C","Bullets":"#002566"
};
let D = null;          // loaded data
let PLAYERS = null;    // name -> player
let EPOCH = Date.UTC(2026, 10, 22);

/* =====================================================================
   SHARED ENGINE
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]/gi, "").toLowerCase();
const initials = name => name.replace(/ (Jr\.|III|II|IV)$/, "").split(/\s+/).map(w => w[0].toUpperCase() + ".").join(" ");
const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, reduced() ? 0 : ms));
const store = {
  get(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function today() {
  const d = new Date();
  const index = Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / 86400000);
  const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  return { index, key, label: d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) };
}
let day = today();
const dailyIndex = n => ((day.index % n) + n) % n;
const dayKey = g => `sa2:${SPORT}:${g}:day:${day.key}`;
const statsKey = g => `sa2:${SPORT}:${g}:stats`;
const LEVELS = ["Easy", "Medium", "Hard"];
const badge = (lvl, practice) => `<div class="badges">${practice ? '<span class="badge pr">Practice</span>' : ""}${archBadge()}</div>`;
function archBadge() { const g = GAMES[current], st = g && g.obj.st; return st && st.mode === "archive" ? `<span class="badge pr">Archive · Day ${st.idx + 1}</span>` : ""; }

function recordStats(g, won, slot) {
  const st = store.get(statsKey(g), { played: 0, wins: 0, streak: 0, best: 0, lastWin: null });
  st.played += 1;
  if (won) { st.wins += 1; st.streak = st.lastWin === day.index - 1 ? st.streak + 1 : 1; st.best = Math.max(st.best, st.streak); st.lastWin = day.index; }
  else st.streak = 0;
  store.set(statsKey(g), st);
}
function getStats(g) {
  const st = store.get(statsKey(g), { played: 0, wins: 0, streak: 0, best: 0, lastWin: null });
  return { ...st, streak: st.lastWin !== null && st.lastWin >= day.index - 1 ? st.streak : 0 };
}
function statsHTML(g) {
  const s = getStats(g), pct = s.played ? Math.round(s.wins / s.played * 100) : 0;
  return `<div class="stats">${[["Played", s.played], ["Win %", pct], ["Streak", s.streak], ["Best", s.best]]
    .map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("")}</div>`;
}
function copyShare(btn, text) {
  text = `${text}\n${shareURL()}`;
  const ok = () => { btn.innerHTML = `${ICON.check}<span>Copied!</span>`; setTimeout(() => btn.innerHTML = `${ICON.copy}<span>Copy result</span>`, 1600); };
  const fail = () => { btn.textContent = "Select the text to copy"; };
  try { navigator.clipboard.writeText(text).then(ok, fail); } catch (e) { fail(); }
}

/* ---- Results: inline card + congrats popup ---- */
function resultBody(gameId, obj) {
  const r = obj.result(), st = obj.st, daily = st.mode === "daily";
  return `<h2>${esc(r.title)}</h2><p>${esc(r.text)}</p>
    ${r.summary}

function nextGameButton(gameId) {
  const next = GAME_ORDER.find(g => g !== gameId && gameStatus(g).kind !== "won" && gameStatus(g).kind !== "lost");
  return next ? `<button class="ghost" type="button" data-act="goto" data-to="${next}">Next: ${GAMES[next].title}</button>` : "";
}
function wireResult(root, gameId, obj) {
  root.querySelectorAll('[data-act="copy"]').forEach(b => b.addEventListener("click", () => copyShare(b, obj.share())));
  root.querySelectorAll('[data-act="goto"]').forEach(b => b.addEventListener("click", () => { closeModal(); location.hash = b.dataset.to; }));
  root.querySelectorAll('[data-act="practice"]').forEach(b => b.addEventListener("click", () => { closeModal(); obj.loadPractice(); viewSeq++; render(); window.scrollTo(0, 0); }));
  root.querySelectorAll('[data-act="daily"]').forEach(b => b.addEventListener("click", () => { obj.loadDaily(); viewSeq++; render(); }));
  root.querySelectorAll('[data-act="results"]').forEach(b => b.addEventListener("click", () => openModal(gameId, obj, false)));

let lastFocus = null;
function openModal(gameId, obj, celebrate) {
  const r = obj.result();
  lastFocus = document.activeElement;
  $("modal-root").innerHTML = `<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <button class="x" type="button" aria-label="Close" id="m-close">${ICON.x}</button>
      <div class="kicker">${GAMES[gameId].title}${obj.st.mode === "practice" ? " · Practice" : (obj.st.mode === "archive" ? " · Archive" : "") + " · Day " + (obj.st.idx + 1)}</div>
      <div id="m-title">${resultBody(gameId, obj)}</div></div></div>`;
  wireResult($("modal-root"), gameId, obj);
  $("m-close").addEventListener("click", closeModal);
  $("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeModal(); });
  document.addEventListener("keydown", escClose);

}
function escClose(e) { if (e.key === "Escape") closeModal(); }
function closeModal() {
  $("modal-root").innerHTML = "";
  document.removeEventListener("keydown", escClose);
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function confetti() {
  if (reduced()) return;
  const c = document.createElement("canvas"); c.className = "confetti";
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
  document.body.appendChild(c);
  const x = c.getContext && c.getContext("2d");
  if (!x) { c.remove(); return; }
  const cols = ["#7b3fe4", "#e070c9", "#f2c84b", "#8ccb6e", "#84aef2", "#ffffff"];
  const bits = Array.from({ length: 140 }, () => ({ x: c.width / 2 + (Math.random() - .5) * c.width * .3, y: c.height * .35,
    vx: (Math.random() - .5) * 18, vy: -Math.random() * 18 - 6, r: Math.random() * 6 + 4, a: Math.random() * 6, col: cols[Math.floor(Math.random() * cols.length)] }));
  let f = 0;
  (function step() {
    x.clearRect(0, 0, c.width, c.height);
    bits.forEach(b => { b.vy += .45; b.x += b.vx; b.y += b.vy; b.a += .2; x.save(); x.translate(b.x, b.y); x.rotate(b.a); x.fillStyle = b.col; x.fillRect(-b.r, -b.r / 2, b.r * 2, b.r); x.restore(); });
    if (++f < 150) requestAnimationFrame(step); else c.remove();
  })();
}

/* ---- Autocomplete ---- */
function attachAutocomplete(input, list, getNames, onPick) {

  const close = () => { list.hidden = true; input.setAttribute("aria-expanded", "false"); active = -1; };
  const paint = () => [...list.children].forEach((li, i) => li.setAttribute("aria-selected", i === active ? "true" : "false"));
  input.addEventListener("input", () => {
    const q = norm(input.value.trim());
    list.innerHTML = "";
    if (q.length < 2) { close(); return; }
    const all = getNames();
    const starts = all.filter(n => norm(n).split(" ").some(w => w.startsWith(q)) || norm(n).startsWith(q));
    const rest = all.filter(n => !starts.includes(n) && norm(n).includes(q));
    const items = [...starts, ...rest].slice(0, 8);
    items.forEach(n => {
      const li = document.createElement("li"); li.setAttribute("role", "option"); li.textContent = n;
      li.addEventListener("mousedown", e => { e.preventDefault(); onPick(n); });
      list.appendChild(li);
    });
    active = items.length ? 0 : -1; paint();
    list.hidden = !items.length; input.setAttribute("aria-expanded", items.length ? "true" : "false");
  });
  input.addEventListener("keydown", e => {
    const items = [...list.children];
    if (e.key === "ArrowDown" && items.length) { e.preventDefault(); active = (active + 1) % items.length; paint(); items[active].scrollIntoView({ block: "nearest" }); }
    else if (e.key === "ArrowUp" && items.length) { e.preventDefault(); active = (active - 1 + items.length) % items.length; paint(); items[active].scrollIntoView({ block: "nearest" }); }
    else if (e.key === "Escape") close();
  });
  input.addEventListener("blur", () => setTimeout(close, 120));
  return () => (!list.hidden && active >= 0 && list.children[active]) ? list.children[active].textContent : null;
}

/* Old names -> today's franchise. Keys are "Nickname" or "Nickname|City" when the nickname alone is ambiguous. */
const RENAMES = {
  nba: { "SuperSonics": "Thunder", "Bullets": "Wizards", "Bobcats": "Hornets", "Hornets|New Orleans": "Pelicans", "Hornets|New Orleans/Oklahoma City": "Pelicans" },
  nfl: { "Oilers": "Titans", "Washington": "Commanders" },
  nhl: { "Whalers": "Hurricanes", "Nordiques": "Avalanche", "North Stars": "Stars", "Thrashers": "Jets", "Mighty Ducks": "Ducks", "Hockey Club": "Mammoth" },
  mlb: { "Indians": "Guardians", "Expos": "Nationals", "Devil Rays": "Rays" }
};
const nowName = (t, c) => { const R = RENAMES[SPORT] || {}; return R[`${t}|${c}`] || R[t] || t; };
// One stop per franchise stint: a team that moved or was renamed mid-stint stays one stop ("Québec (Nordiques) → Colorado")
function stopsOf(p) {
  const out = [];
  p.path.forEach(s0 => {
    const now = nowName(s0.t, s0.c);
    const where = now !== s0.t ? (s0.t === "Washington" ? "as Washington" : s0.c ? `${s0.c} (${s0.t === "Hockey Club" ? "Utah Hockey Club" : s0.t})` : asOld(s0.t)) : s0.c;
    const last = out[out.length - 1];
    if (last && last.t === now) { if (last.c !== where) last.c += ` → ${where}`; }
    else out.push({ t: now, c: where });
  });
  return out;
}
const nowNick = t => (RENAMES[SPORT] || {})[t] || t;
const asOld = t => t === "Washington" ? "as Washington" : t === "Hockey Club" ? "as Utah Hockey Club" : `as the ${t}`;
function teamLabel(label) {
  const m = label.match(/^Played for (?:the )?(.+)$/);
  if (!m) return label;
  const now = (RENAMES[SPORT] || {})[m[1]];
  if (!now) return label;
  return m[1] === "Hockey Club" ? `Played for the Utah Hockey Club (now the ${now})` : `${label} (now the ${now})`;
}
const SKIP = "__skip__";

/* =====================================================================
   GAME 1: JOURNEYMAN
   ===================================================================== */
const JM_MAX = 6;
// Six clues each: the first is open from the start, then one more after every miss (6 guesses = all six by the last guess)
const JM_HINTS_BY = {
  nba: [{ key: "seasons", label: "Seasons" }, { key: "pos", label: "Position" }, { key: "draft", label: "Draft" },
        { key: "honors", label: "All-Star picks · Titles" }, { key: "college", label: "College" }, { key: "initials", label: "Initials" }],
  nfl: [{ key: "seasons", label: "Seasons" }, { key: "pos", label: "Position" }, { key: "draft", label: "Draft" },
        { key: "honors", label: "Pro Bowls · All-Pro" }, { key: "origin", label: "College" }, { key: "initials", label: "Initials" }],
  nhl: [{ key: "seasons", label: "Seasons" }, { key: "pos", label: "Position" }, { key: "draft", label: "Draft" },
        { key: "honors", label: "Stanley Cups" }, { key: "origin", label: "Birthplace" }, { key: "initials", label: "Initials" }],
  mlb: [{ key: "seasons", label: "Seasons" }, { key: "pos", label: "Position" }, { key: "hand", label: "Bats · Throws" },
        { key: "honors", label: "All-Star picks · Titles" }, { key: "origin", label: "Birthplace" }, { key: "initials", label: "Initials" }]
};
const jmHints = () => JM_HINTS_BY[SPORT] || JM_HINTS_BY.nba;
const openClues = (wrong, total, done) => done ? total : Math.min(wrong + 1, total);
const jm = {
  st: null, store: "journeyman", fresh: -1,
  loadDaily() { this.loadAt(day.index, "daily"); },
  loadArchive(i) { this.loadAt(i, "archive"); },
  loadAt(i, mode) {
    const list = D.journeyman, puzzle = list[((i % list.length) + list.length) % list.length], key = puzzleKey("journeyman", i, mode);
    const s = store.get(key, null), ok = s && s.name === puzzle.n;
    this.st = { mode, idx: i, key, puzzle, guesses: ok ? s.guesses : [], done: ok ? s.done : false, won: ok ? s.won : false };
  },
  loadPractice() {
    const list = D.journeyman, daily = list[dailyIndex(list.length)].n, cur = this.st && this.st.puzzle.n;
    const pool = list.filter(p => p.n !== daily && p.n !== cur);
    this.st = { mode: "practice", puzzle: pool[Math.floor(Math.random() * pool.length)], guesses: [], done: false, won: false };
  },
  save() { const st = this.st; if (st.key) store.set(st.key, { name: st.puzzle.n, guesses: st.guesses, done: st.done, won: st.won }); },
  feedback(name) {
    if (name === SKIP) return { kind: "skip", text: "Skipped" };
    if (name === this.st.puzzle.n) return { kind: "hit", text: "Correct" };
    const p = PLAYERS.get(name), ans = new Set(this.st.puzzle.path.map(s => nowName(s.t, s.c)));
    const shared = p ? [...new Set(p.t.map(nowNick))].filter(t => ans.has(t)) : [];
    return shared.length ? { kind: "near", text: "Shared: " + shared.join(", ") } : { kind: "miss", text: "No shared teams" };
  },
  guess(raw) {
    const st = this.st; if (st.done) return;
    const m = raw === SKIP ? { n: SKIP } : PLAYERS.get(raw) || [...PLAYERS.values()].find(p => norm(p.n) === norm(raw));
    if (!m) { $("msg").textContent = "Pick a player from the list."; return; }
    if (m.n !== SKIP && st.guesses.includes(m.n)) { $("msg").textContent = `You already guessed ${m.n}.`; return; }
    st.guesses.push(m.n); this.fresh = st.guesses.length - 1;
    if (m.n === st.puzzle.n) { st.done = true; st.won = true; } else if (st.guesses.length >= JM_MAX) st.done = true;
    if (st.done && st.mode === "daily") recordStats("journeyman", st.won);
    this.save(); render(); this.fresh = -1;
    if (st.done) setTimeout(() => openModal("journeyman", this, true), reduced() ? 0 : 500); else $("guess").focus();
  },
  share() {
    const st = this.st, sq = st.guesses.map(g => ({ hit: "🟩", near: "🟨", miss: "⬛", skip: "⬜" })[this.feedback(g).kind]).join("");
    const head = st.mode === "practice" ? `Shootaround ${LG()} · Journeyman (practice)` : `Shootaround ${LG()} · Journeyman #${st.idx + 1}`;
    return `${head}\n🏀 ${st.won ? st.guesses.length : "X"}/${JM_MAX}  ${sq}`;
  },
  result() {
    const st = this.st, p = st.puzzle;
    return { won: st.won,
      title: st.won ? (st.guesses.length === 1 ? "First try!" : st.guesses.length <= 3 ? "Got him!" : "Nice save!") : "Out of guesses",
      text: st.won ? `It was ${p.n}, in ${st.guesses.length} of ${JM_MAX} guesses.` : `The answer was ${p.n}.`,
      summary: `<ul class="summary">${st.guesses.map((g, i) => `<li><span>${i + 1}. ${g === SKIP ? "Skipped" : esc(g)}</span><span>${g === SKIP ? "" : esc(this.feedback(g).text)}</span></li>`).join("")}</ul>` };
  },
  render(root) {
    if (!this.st) this.loadDaily();
    const st = this.st, p = st.puzzle, seen = new Set();
    const route = stopsOf(p).map((s, i) => {
      const back = seen.has(s.t); seen.add(s.t);
      return `<li class="stop" style="--i:${i};--c:${(D.colors || TEAM_COLORS)[s.t] || "var(--muted)"}"><span class="dot" aria-hidden="true"></span>
        <span class="stop-num">${String(i + 1).padStart(2, "0")}</span><span class="stop-team">${esc(s.t)}${back ? '<span class="again">Return</span>' : ""}</span>
        <span class="stop-sub">${esc(s.c)}</span></li>`;
    }).join("");
    const wrong = st.guesses.filter(g => g !== p.n).length;
    const shown = openClues(wrong, jmHints().length, st.done);
    const rows = Array.from({ length: JM_MAX }, (_, i) => {
      const g = st.guesses[i];
      if (!g) return i === st.guesses.length && !st.done ? `<li class="row empty"><span class="n">${i + 1}</span><span class="who left">${JM_MAX - i} guess${JM_MAX - i === 1 ? "" : "es"} left</span><span></span></li>` : "";
      const f = this.feedback(g);
      return `<li class="row ${f.kind} ${i === this.fresh ? "fresh" : ""}"><span class="n">${i + 1}</span><span class="who">${g === SKIP ? "—" : esc(g)}</span><span class="why">${esc(f.text)}</span></li>`;
    }).join("");
    const clues = cluePanel(jmHints(), { ...p.h, initials: initials(p.n) }, shown);
    root.innerHTML = `<div class="layout"><div class="main">
      <section class="card">
        <div class="title-row"><h2 class="game-title" style="color:var(--g-jm)">Journeyman</h2>${badge(p.lvl, st.mode === "practice")}</div>
        <p class="prompt">Name the ${LG()} player who made these <b>${stopsOf(p).length} stops</b>, in order.</p>
        <ol class="route">${route}</ol>
      </section>
      ${stopsOf(p).length <= 5 ? clues : ""}</div>
      <aside class="side">
        ${st.done ? "" : guessForm()}
        ${stopsOf(p).length > 5 ? clues : ""}
        <ol class="log" aria-label="Your guesses">${rows}</ol>
        ${pageFooter(st)}
      </aside></div>`;
    if (!st.done) {
      const pick = attachAutocomplete($("guess"), $("suggest"), () => NAMES.filter(n => !st.guesses.includes(n)), n => this.guess(n));
      root.querySelector("form").addEventListener("submit", e => { e.preventDefault(); this.guess(pick() || $("guess").value.trim()); });
      $("skip").addEventListener("click", () => this.guess(SKIP));
    }
    wireResult(root, "journeyman", this);
  }
};

/* =====================================================================
   GAME 2: KNECHT 4
   ===================================================================== */
const K4_MISTAKES = 4, K4_HINTS = 3;
const TIER_EMOJI = ["🟨", "🟩", "🟦", "🟪"];
const SHAPES = ["●", "▲", "■", "◆"];
const k4 = {
  st: null, store: "knecht", busy: false, landed: -1,
  fresh(id, mode, seedIdx) {
    const names = D.knecht[id].groups.flatMap(g => g.p);
    return { mode, id, solved: [], mistakes: 0, history: [], tried: [], selected: [], hints: 0, revealed: [],
      order: shuffle(names, mode === "practice" ? Math.random() * 1e6 : (seedIdx ?? day.index) + 7), done: false, won: false };
  },
  loadDaily() { this.loadAt(day.index, "daily"); },
  loadArchive(i) { this.loadAt(i, "archive"); },
  loadAt(i, mode) {
    const n = D.knecht.length, id = ((i % n) + n) % n, key = puzzleKey("knecht", i, mode), s = store.get(key, null);
    this.st = s && s.id === id ? { ...s, mode, idx: i, key, selected: [] } : { ...this.fresh(id, mode, i), idx: i, key };
  },
  loadPractice() {
    const n = D.knecht.length, daily = dailyIndex(n);
    let id; do { id = Math.floor(Math.random() * n); } while (id === daily || (this.st && id === this.st.id));
    this.st = this.fresh(id, "practice");
  },
  save() {
    const st = this.st;
    if (st.key) store.set(st.key, { id: st.id, solved: st.solved, mistakes: st.mistakes, history: st.history, tried: st.tried, order: st.order, hints: st.hints, revealed: st.revealed || [], done: st.done, won: st.won });
  },
  groups() { return D.knecht[this.st.id].groups; },
  tierOf(name) { return this.groups().find(g => g.p.includes(name)).tier; },
  toast(text) {
    const card = $("k-card"); if (!card) return;
    card.querySelectorAll(".toast").forEach(t => t.remove());
    const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = text;
    card.appendChild(t); setTimeout(() => t.remove(), 1900);
  },
  async submit() {
    const st = this.st, sel = [...st.selected];
    if (sel.length !== 4 || st.done || this.busy) return;
    const sig = [...sel].sort().join("|");
    if (st.tried.includes(sig)) { this.toast("Already guessed!"); return; }
    this.busy = true; this.lockButtons(true);
    const tiles = sel.map(n => this.tileEl(n)).filter(Boolean);
    // 1) hop: the four selected tiles jump one after another
    if (!reduced()) {
      await Promise.all(tiles.map((t, i) => t.animate([{ transform: "none" }, { transform: "translateY(-9px)" }, { transform: "none" }],
        { duration: 240, delay: i * 80, easing: "ease-out" }).finished));
      await wait(60);
    }
    st.tried.push(sig);
    st.history.push(sel.map(n => this.tierOf(n)));
    const groups = this.groups();
    const gi = groups.findIndex(g => g.p.every(p => sel.includes(p)));
    if (gi >= 0) {
      // 2a) correct: tiles slide into the top row, then become the group bar
      await this.flipToTop(sel);
      this.lockIn(gi);
      if (st.solved.length === 4) { st.done = true; st.won = true; }
      this.finish();
      return;
    }
    // 2b) wrong: shake in place, lose a dot, keep the selection
    st.mistakes += 1;
    const best = Math.max(...groups.map(g => g.p.filter(p => sel.includes(p)).length));
    if (!reduced()) {
      await Promise.all(tiles.map(t => t.animate([{ transform: "translateX(0)" }, { transform: "translateX(-7px)" }, { transform: "translateX(7px)" },
        { transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "translateX(0)" }], { duration: 400, easing: "ease-in-out" }).finished));
    }
    const pip = document.querySelectorAll("#k-card .pip")[st.mistakes - 1];
    if (pip) pip.classList.add("used");
    const pips = document.querySelector("#k-card .pips");
    if (pips) pips.setAttribute("aria-label", `${K4_MISTAKES - st.mistakes} mistakes left`);
    if (st.mistakes < K4_MISTAKES) {
      this.toast(best === 3 ? "One away…" : "Not quite");
      this.save(); this.busy = false; this.lockButtons(false);
      return;
    }
    // out of mistakes: walk each remaining group into place, easiest first
    this.toast("Out of mistakes");
    st.done = true;
    await wait(700);

    row: [{ k: "fg", l: "FG%", f: "p1" }, { k: "x3", l: "3P%", f: "p1" }, { k: "ft", l: "FT%", f: "p1" }, { k: "spg", l: "STL", f: "d1" },

    cols: [{ k: "ppg", l: "PPG", f: "d1", tol: 2 }, { k: "rpg", l: "RPG", f: "d1", tol: 1.5 }, { k: "apg", l: "APG", f: "d1", tol: 1.5 },
           { k: "fg", l: "FG%", f: "p1", tol: .02 }, { k: "x3", l: "3P%", f: "p1", tol: .02 }, { k: "spg", l: "STL", f: "d1", tol: .3 },
           { k: "bpg", l: "BLK", f: "d1", tol: .3 }, { k: "tov", l: "TOV", f: "d1", tol: .4 }] } },
  sl_hints: [{ key: "years", label: "Career" }, { key: "pos", label: "Position" }, { key: "honors", label: "All-Star picks · Titles" },
             { key: "draft", label: "Draft" }, { key: "college", label: "College" }]

const spec = () => D.spec || NBA_SPEC;
const LG = () => SPORTS[SPORT].label;
const sl = {
  st: null, store: "statline", fresh: -1,

  loadAt(i, mode) {

  loadAt(i, mode) {

    const s = store.get(key, null), ok = s && s.sig === this.sig(qs);

  loadPractice() {

    if (el && !reduced()) {
      const start = performance.now(), dur = 700, to = q.b.v;

        const step = t => {

  const root = $("view");
  $("nav").innerHTML = [["", "Today", "home"], ...GAME_ORDER.map(g => [g, GAMES[g].title, GAME_ICON[g]])].map(([h, l, ic]) => {
    const fin = h && ["won", "lost"].includes(gameStatus(h).kind);
    return `<a href="#${SPORT}${h ? "-" + h : ""}" ${current === (h || "home") ? 'aria-current="page"' : ""}>${ICON[ic]}<span>${h && GAMES[h].short ? `<span class="full">${l}</span><span class="short">${GAMES[h].short}</span>` : l}</span>${fin ? '<span class="done-dot" aria-label="finished"></span>' : ""}</a>`;
  }).join("");
  $("sportbar").innerHTML = sportTabs();
  $("meta").innerHTML = `<strong>${LG()} · Day ${day.index + 1}</strong> · ${day.label}`;
  const g = GAMES[current];
  if (g) g.obj.render(root); else renderHome(root);
  tick();
}
async function route() {
  let h = location.hash.slice(1);
  let sport = store.get("sa2:sport", "nba"), game = "home";
  if (h === "knecht-4") h = "links";
  if (GAMES[h]) game = h;                                  // old links like #journeyman
  else {
    const m = h.match(/^(nba|nfl|nhl|mlb)(?:-(.+))?$/);
    if (m) { sport = m[1]; const g2 = m[2] === "knecht-4" ? "links" : m[2]; game = GAMES[g2] ? g2 : "home"; }
  }
  if (!SPORTS[sport]) sport = "nba";
  const token = ++loadToken;
  closeModal();
  try {
    if (sport !== SPORT || !D) await useSport(sport, token);
  } catch (e) {
    $("view").innerHTML = `<p class="loading">Couldn't load the ${SPORTS[sport].label} puzzles. Refresh the page to try again.</p>`;
    return;
  }
  if (token !== loadToken) return;
  const sameGame = game === current;
  current = game;
  viewSeq++;
  render();
  if (!sameGame) window.scrollTo(0, 0);                    // only jump to the top when the game changes, not the sport
  const seenKey = "sa2:seen:" + (GAMES[game] ? game : "home");
  if (!store.get(seenKey, false)) { store.set(seenKey, true); openHelp(); }
}
function tick() {
  const now = new Date(), ms = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1) - now;
  const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
  document.querySelectorAll(".countdown").forEach(el => el.textContent = `Next puzzles in ${h}h ${String(m).padStart(2, "0")}m ${String(s).padStart(2, "0")}s`);
  if (D && today().key !== day.key) {
    day = today();
    [jm, k4, sl, hl].forEach(o => { if (!o.st || o.st.mode === "daily") o.loadDaily(); });
    render();
  }
}

function start() {
  $("btn-help").innerHTML = ICON.help; $("btn-stats").innerHTML = ICON.stats; $("btn-settings").innerHTML = ICON.gear;
  $("btn-settings").addEventListener("click", openSettings);
  $("btn-credits").addEventListener("click", openCredits);
  if (store.get("sa2:cb", false)) document.documentElement.classList.add("cb");
  $("btn-help").addEventListener("click", openHelp);
  $("btn-stats").addEventListener("click", openStats);
  window.addEventListener("hashchange", route);
  route().then(prefetchSports);
  setInterval(tick, 1000);
}
start();
</script>
</body>
